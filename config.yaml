knowledge_base:
  kb_id: pilot
  documents:
    - {doc_id: P4, title: "Р4. Дополнительные инструменты управления потоком выполнения",
       path: "4_Dopolnitelnye_instrumenty_upravlenia_potokom_vypolnenia_dokumentatsia.pdf", chapter: 4}
    - {doc_id: P5, title: "Р5. Структуры данных",
       path: "5_Struktury_dannykh__dokumentatsia_Python_3_10_22.pdf", chapter: 5}
    - {doc_id: P9, title: "Р9. Классы",
       path: "9_Klassy__dokumentatsia_Python_3_10_22.pdf", chapter: 9}

parsing:
  repeated_line_ratio: 0.5   # строки, повторяющиеся на >= 50% страниц, считаются колонтитулами
  max_heading_chars: 120
  max_section_depth: 4
  heading_size_ratio: 1.1    # заголовок набран крупнее основного текста минимум в 1.1 раза
  code_indent_min_x: 44.0    # блоки кода в этих PDF смещены вправо относительно текста (x≈45 против 40)
  paragraph_gap_ratio: 1.35  # разрыв между строками > ratio * межстрочный интервал = новый абзац
  code_gap_ratio: 2.5        # в коде пустая строка внутри примера (≈2 интервала) не рвёт блок

chunking:
  max_chars: 1800          # ≈ 450–500 токенов для русского текста
  overlap_chars: 250
  min_chars: 300           # фрагменты короче склеиваются с соседним в пределах раздела
  heading_prefix: true

ollama:
  base_url: "http://localhost:11434"
  embed_model: "bge-m3"
  embed_batch_size: 16
  llm_model: "qwen3:8b"
  num_ctx: 8192
  temperature: 0.1
  think: false
  timeout_s: 300

retrieval:
  top_k: 6
  min_score: null          # порог отказа; на этапе 1 выключен, только логируем top-score

eval:
  questions: mentor/eval/questions.yaml
  snippet_chars_cli: 200
  snippet_chars_report: 300

paths:
  parsed_dir: data/parsed
  index_dir: data/index
  runs_dir: runs
