- id: "M1"
  type: multi
  question: "Как в Python устроен перебор элементов коллекции - что общего между перебором списка в цикле for и перебором словаря, и какие инструменты для этого описаны в материалах?"
  reference: "В Python оператор for перебирает элементы любой последовательности в том порядке, в котором они появляются (Р4, 4.2). Для перебора чисел используется range(), конечная точка не входит в последовательность (Р4, 4.3). Для перебора индексов можно комбинировать range() и len(), но удобнее enumerate() (Р4, 4.3). В разделе 5 описаны конкретные приёмы: items() для одновременного получения ключа и значения словаря; enumerate() для индекса и значения; zip() для двух и более последовательностей; reversed() для обратного порядка; sorted() для сортированного; sorted(set(...)) для уникальных элементов в отсортированном порядке (Р5, 5.6)."
  gold:
    - {doc_id: P4, section: "4.2", pages: []}
    - {doc_id: P4, section: "4.3", pages: []}
    - {doc_id: P5, section: "5.6", pages: []}
- id: "M2"
  type: multi
  question: "Как связаны пространства имён, области видимости и классы в Python − что создаётся при определении класса и как это соотносится с общим механизмом пространств имён?"
  reference: "Пространство имён — это отображение имён на объекты (Р9, 9.2). Локальное пространство имён функции создаётся при её вызове и удаляется после возврата или необработанного исключения; при рекурсии каждый вызов имеет собственное пространство (Р9, 9.2). В разделе 4 этот механизм описан на уровне функций: при выполнении функции создаётся новая таблица символов для локальных переменных, поиск идёт от локальной к объемлющим, затем к глобальной и встроенной (Р4, 4.7). Определения классов помещают ещё одно пространство имён в локальную область видимости (Р9, 9.2). При создании определения класса создаётся новое пространство имён, используемое как локальная область видимости; после завершения создаётся объект класса — обёртка над этим пространством (Р9, 9.3.1). Таким образом, механизм един для функций и классов, различие — в моменте создания и в том, что класс становится объектом."
  gold:
    - {doc_id: P9, section: "9.2", pages: []}
    - {doc_id: P9, section: "9.3.1", pages: []}
    - {doc_id: P4, section: "4.7", pages: []}
