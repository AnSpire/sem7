- id: "1"
  type: main
  category: Определение
  question: "Для чего используются классы в Python?"
  reference: "Классы предоставляют средство для объединения данных и функциональности."
  gold: [{doc_id: P9, section: "9", pages: [1]}]
- id: "2"
  type: main
  category: Определение
  question: "Что такое пространство имён в Python?"
  reference: "Пространство имён − это отображение имён на объекты."
  gold: [{doc_id: P9, section: "9.2", pages: [2]}]
- id: "3"
  type: main
  category: Объяснение
  question: "Что происходит с локальным пространством имён при вызове функции?"
  reference: "При вызове функции создаётся локальное пространство имён. Оно удаляется после возврата из функции или после возникновения необработанного исключения. При рекурсивных вызовах каждый вызов имеет собственное локальное пространство имён."
  gold: [{doc_id: P9, section: "9.2", pages: [2]}]
- id: "4"
  type: main
  category: Факт / процесс
  question: "Что создаётся после нормального завершения определения класса?"
  reference: "После нормального завершения определения класса создаётся объект класса."
  gold: [{doc_id: P9, section: "9.3.1", pages: [5]}]
- id: "5"
  type: main
  category: Назначение
  question: "Для чего используется метод __init__?"
  reference: "Если класс определяет метод __init__(), он автоматически вызывается при создании нового экземпляра класса."
  gold: [{doc_id: P9, section: "9.3.2", pages: [6]}]
- id: "6"
  type: main
  category: Сравнение
  question: "В чём различие между переменными экземпляра и переменными класса?"
  reference: "Переменные экземпляра предназначены для данных, уникальных для каждого экземпляра, а переменные класса − для атрибутов и методов, общих для всех экземпляров класса."
  gold: [{doc_id: P9, section: "9.3.5", pages: [7]}]
- id: "7"
  type: main
  category: Назначение
  question: "Для чего используется функция range()?"
  reference: "Функция range() используется для перебора последовательности чисел и генерирует арифметические прогрессии."
  gold: [{doc_id: P4, section: "4.3", pages: [2]}]
- id: "8"
  type: main
  category: Правило
  question: "Входит ли конечная точка в последовательность, создаваемую range()?"
  reference: "Нет. Указанная конечная точка никогда не является частью генерируемой последовательности."
  gold: [{doc_id: P4, section: "4.3", pages: [2]}]
- id: "9"
  type: main
  category: Назначение
  question: "Что делает оператор break внутри цикла?"
  reference: "Оператор break выходит за пределы самого внутреннего ограничивающего цикла for или while."
  gold: [{doc_id: P4, section: "4.4", pages: [3]}]
- id: "10"
  type: main
  category: Условие
  question: "Когда выполняется блок else, связанный с циклом?"
  reference: "Он выполняется, когда цикл завершается исчерпанием итерируемого объекта (for) или когда условие становится ложным (while), но не когда цикл завершается оператором break."
  gold: [{doc_id: P4, section: "4.4", pages: [3, 4]}]
- id: "11"
  type: main
  category: Назначение
  question: "Что возвращает метод list.pop() без указания индекса?"
  reference: "Он удаляет и возвращает последний элемент списка."
  gold: [{doc_id: P5, section: "5.1", pages: [1]}]
- id: "12"
  type: main
  category: Объяснение / сравнение
  question: "Почему список не рекомендуется использовать в качестве очереди?"
  reference: "Вставка или удаление элементов в начале списка выполняется медленно, поскольку все остальные элементы приходится сдвигать. Для очередей рекомендуется использовать collections.deque, предназначенный для быстрых операций добавления и удаления с обоих концов."
  gold: [{doc_id: P5, section: "5.1.2", pages: [3]}]
- id: "13"
  type: main
  category: Определение
  question: "Что такое множество (set) в Python?"
  reference: "Множество — это неупорядоченная коллекция, не содержащая повторяющихся элементов."
  gold: [{doc_id: P5, section: "5.4", pages: [7]}]
- id: "14"
  type: main
  category: Определение
  question: "Что такое словарь (dictionary) в Python?"
  reference: "Словарь представляет собой набор пар «ключ: значение», причём ключи должны быть уникальными в пределах одного словаря."
  gold: [{doc_id: P5, section: "5.5", pages: [8]}]
- id: "15"
  type: main
  category: Правило / ограничение
  question: "Какие значения могут использоваться в качестве ключей словаря?"
  reference: "Ключи словаря могут быть любого неизменяемого типа. Строки и числа всегда могут быть ключами. Кортежи могут использоваться в качестве ключей, если содержат только строки, числа или другие кортежи."
  gold: [{doc_id: P5, section: "5.5", pages: [8]}]

